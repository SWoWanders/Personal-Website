name: Tidy art (duplicates + rotating collection)

# Runs whenever art or the gallery list changes. Finds the same image uploaded
# more than once (even resized or re-saved) and removes the extra copies, then
# adds any new images to the rotating collection (art/*/collection.json).
on:
  push:
    branches: [main]
    paths: ['art/**', 'gallery.html']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Find and remove duplicates
        run: python tools/dedupe_art.py | tee "$RUNNER_TEMP/dedupe.log"
      - name: Add new images to the rotating collection
        run: python tools/sync_collection.py | tee -a "$RUNNER_TEMP/dedupe.log"
      - name: Commit any changes
        run: |
          if [ -n "$(git status --porcelain -- art gallery.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A art gallery.html
            git commit -m "Tidy art: duplicates and collection" -m "$(cat "$RUNNER_TEMP/dedupe.log")"
            git push
            { echo '### Art tidied'; echo '```'; cat "$RUNNER_TEMP/dedupe.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Nothing to tidy.' >> "$GITHUB_STEP_SUMMARY"
          fi
