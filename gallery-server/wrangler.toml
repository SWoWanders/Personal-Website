# The Sound Gallery's room server: one Durable Object per room ("public", or a private room's code).
name = "sound-gallery-rooms"
main = "worker.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
